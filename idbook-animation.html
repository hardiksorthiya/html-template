<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>IDBook — From Sketch to Reality</title>

<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.7/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.7/dist/ScrollTrigger.min.js"></script>

<style>

:root {

    --bg: #061516;

    --bg-light: #0b2324;

    --teal: #00d8d2;

    --teal-light: #8ffffa;

    --white: #ffffff;

    --paper: #f4f2eb;

    --ink: #202727;

}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {

    width: 100%;

    background: var(--bg);

    color: white;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

}

body {
    overflow-x: hidden;
}


/* =====================================================
   HEADER
===================================================== */

.header {

    position: fixed;

    top: 0;
    left: 0;

    width: 100%;

    height: 82px;

    padding: 0 4vw;

    display: flex;

    justify-content: space-between;

    align-items: center;

    z-index: 100;

    border-bottom:
        1px solid rgba(255,255,255,.12);

    background:
        rgba(3,13,14,.55);

    backdrop-filter:
        blur(15px);

}

.logo {

    font-size: 36px;

    letter-spacing: -3px;

    font-weight: 300;

}

.logo i {

    color: var(--teal);

    font-style: normal;

}

.header-right {

    display: flex;

    gap: 15px;

    align-items: center;

}

.talk {

    background: white;

    color: #061516;

    border: 0;

    padding:
        13px 25px;

    border-radius: 40px;

    font-size: 14px;

}

.language {

    width: 44px;

    height: 44px;

    border-radius: 50%;

    border:
        1px solid
        rgba(255,255,255,.4);

    background: transparent;

    color: white;

}


/* =====================================================
   HERO
===================================================== */

.hero {

    position: relative;

    height: 100vh;

    min-height: 720px;

    background:

        radial-gradient(
            circle at 70% 45%,
            rgba(0,216,210,.09),
            transparent 35%
        ),

        linear-gradient(
            120deg,
            #020707,
            #071b1c,
            #020808
        );

    overflow: hidden;

}


/* =====================================================
   BACKGROUND GRID
===================================================== */

.grid {

    position: absolute;

    inset: 0;

    opacity: .12;

    background-image:

        linear-gradient(
            rgba(0,216,210,.3) 1px,
            transparent 1px
        ),

        linear-gradient(
            90deg,
            rgba(0,216,210,.3) 1px,
            transparent 1px
        );

    background-size:
        70px 70px;

}


/* =====================================================
   CENTER STAGE
===================================================== */

.stage {

    position: absolute;

    left: 50%;

    top: 52%;

    width: min(1100px, 82vw);

    height: min(650px, 68vh);

    transform:
        translate(-50%, -50%);

}


/* =====================================================
   SCENE
===================================================== */

.scene {

    position: absolute;

    inset: 0;

    display: flex;

    justify-content: center;

    align-items: center;

}


/* =====================================================
   PAPER
===================================================== */

.paper {

    position: absolute;

    width: 650px;

    max-width: 75vw;

    height: 470px;

    background:
        var(--paper);

    box-shadow:

        0 30px 80px
        rgba(0,0,0,.45),

        0 0 80px
        rgba(255,255,255,.04);

    transform:
        rotate(-2deg)
        scale(.8);

    opacity: 0;

    overflow: hidden;

}


/* paper texture */

.paper::before {

    content: "";

    position: absolute;

    inset: 0;

    opacity: .35;

    background-image:

        linear-gradient(
            rgba(0,0,0,.025) 1px,
            transparent 1px
        ),

        linear-gradient(
            90deg,
            rgba(0,0,0,.025) 1px,
            transparent 1px
        );

    background-size:
        24px 24px;

}


/* paper corner */

.paper::after {

    content: "";

    position: absolute;

    right: 0;

    bottom: 0;

    width: 70px;

    height: 70px;

    background:
        linear-gradient(
            135deg,
            transparent 50%,
            #d8d5cd 51%
        );

}


/* =====================================================
   HAND SKETCH SVG
===================================================== */

.sketch {

    position: absolute;

    inset: 35px;

    width: calc(100% - 70px);

    height: calc(100% - 70px);

}


/* sketch lines */

.sketch path,
.sketch line,
.sketch polyline,
.sketch rect,
.sketch ellipse {

    fill: none;

    stroke:
        #252c2b;

    stroke-width:
        2;

    stroke-linecap:
        round;

    stroke-linejoin:
        round;

}


/* rough lines */

.sketch .rough {

    opacity: .35;

    stroke-width: 1;

}


/* =====================================================
   HAND / PENCIL
===================================================== */

.pencil {

    position: absolute;

    width: 100px;

    height: 8px;

    background:
        linear-gradient(
            90deg,
            #d9b27b,
            #f1d3a0
        );

    border-radius: 5px;

    transform:
        rotate(-25deg);

    right: 80px;

    bottom: 60px;

    opacity: 0;

    box-shadow:
        0 4px 8px rgba(0,0,0,.2);

}

.pencil::after {

    content: "";

    position: absolute;

    right: -14px;

    top: -2px;

    border-left:
        16px solid #333;

    border-top:
        6px solid transparent;

    border-bottom:
        6px solid transparent;

}


/* =====================================================
   ARCHITECTURE WIREFRAME
===================================================== */

.structure {

    position: absolute;

    width: 850px;

    max-width: 80vw;

    opacity: 0;

    transform:
        scale(.65)
        translateY(30px);

    filter:
        drop-shadow(
            0 0 10px
            rgba(0,216,210,.8)
        );

}


.structure svg {

    width: 100%;

}


.structure line,
.structure polyline,
.structure polygon,
.structure rect,
.structure path {

    fill: none;

    stroke:
        var(--teal);

    stroke-width:
        2;

    vector-effect:
        non-scaling-stroke;

}


/* =====================================================
   CAD
===================================================== */

.cad {

    position: absolute;

    width: 800px;

    max-width: 80vw;

    opacity: 0;

    transform:
        scale(.7);

    filter:
        drop-shadow(
            0 0 15px
            rgba(0,216,210,.7)
        );

}


.cad svg {

    width: 100%;

}


.cad line,
.cad rect,
.cad path,
.cad circle {

    fill: none;

    stroke:
        var(--teal-light);

    stroke-width:
        2;

}


/* CAD dimensions */

.dimension {

    font-size: 14px;

    fill:
        var(--teal);

}


/* =====================================================
   3D IMAGE
===================================================== */

.three-d {

    position: absolute;

    width: 820px;

    max-width: 80vw;

    opacity: 0;

    transform:
        scale(.65)
        translateY(40px);

    overflow: hidden;

    border:
        1px solid
        rgba(0,216,210,.6);

    box-shadow:

        0 0 40px
        rgba(0,216,210,.18);

}


.three-d img {

    width: 100%;

    display: block;

}


/* =====================================================
   REALITY
===================================================== */

.reality {

    position: absolute;

    width: 850px;

    max-width: 82vw;

    opacity: 0;

    transform:
        scale(.65);

    overflow: hidden;

    border:
        1px solid
        rgba(0,216,210,.8);

    box-shadow:

        0 0 60px
        rgba(0,216,210,.25),

        0 30px 100px
        rgba(0,0,0,.5);

}


.reality img {

    width: 100%;

    display: block;

}


/* cyan scanning effect */

.scan-line {

    position: absolute;

    left: 0;

    top: 0;

    width: 4px;

    height: 100%;

    background:

        linear-gradient(
            transparent,
            white,
            var(--teal),
            transparent
        );

    box-shadow:
        0 0 25px
        var(--teal),

        0 0 60px
        var(--teal);

    opacity: 0;

}


/* =====================================================
   PURCHASE CARD
===================================================== */

.purchase {

    position: absolute;

    right: 30px;

    bottom: 35px;

    width: 330px;

    padding: 26px;

    background:
        rgba(5,20,21,.9);

    border:
        1px solid
        rgba(0,216,210,.5);

    backdrop-filter:
        blur(20px);

    opacity: 0;

    transform:
        translateY(40px);

    z-index: 20;

}


.purchase small {

    color:
        var(--teal);

    font-size: 10px;

    letter-spacing:
        3px;

}


.purchase h2 {

    margin-top: 10px;

    font-size: 26px;

    font-weight: 400;

}


.purchase-info {

    margin-top: 10px;

    color:
        #9bb1af;

    font-size: 13px;

    line-height: 1.6;

}


.price-row {

    margin-top: 22px;

    display: flex;

    align-items: center;

    justify-content: space-between;

}


.price {

    font-size: 24px;

}


.buy {

    background:
        var(--teal);

    color:
        #031011;

    padding:
        13px 20px;

    text-decoration: none;

    font-size: 12px;

    font-weight: 700;

}


/* =====================================================
   STEP INDICATOR
===================================================== */

.progress {

    position: absolute;

    right: 35px;

    top: 50%;

    transform:
        translateY(-50%);

    z-index: 30;

}


.progress-item {

    display: flex;

    align-items: center;

    gap: 12px;

    margin: 22px 0;

    font-size: 10px;

    letter-spacing: 2px;

    color:
        rgba(255,255,255,.3);

}


.dot {

    width: 8px;

    height: 8px;

    border:
        1px solid
        var(--teal);

    border-radius: 50%;

}


.progress-item.active {

    color: white;

}


.progress-item.active .dot {

    background:
        var(--teal);

    box-shadow:
        0 0 15px
        var(--teal);

}


/* =====================================================
   SCROLL TEXT
===================================================== */

.scroll {

    position: absolute;

    bottom: 25px;

    left: 50%;

    transform:
        translateX(-50%);

    font-size: 10px;

    letter-spacing: 4px;

    color:
        rgba(255,255,255,.5);

}


.scroll span {

    display: block;

    width: 1px;

    height: 40px;

    margin:
        10px auto;

    background:
        linear-gradient(
            white,
            transparent
        );

}


/* =====================================================
   RESPONSIVE
===================================================== */

@media(max-width:900px) {

    .header {

        height: 70px;

        padding:
            0 20px;

    }

    .logo {

        font-size: 28px;

    }

    .talk {

        display: none;

    }

    .stage {

        width: 100vw;

        height: 70vh;

    }

    .paper {

        width: 85vw;

        height: 60vw;

    }

    .structure,
    .cad,
    .three-d,
    .reality {

        width: 95vw;

    }

    .progress {

        right: 12px;

    }

    .progress-item {

        margin: 15px 0;

    }

    .progress-item span:not(.dot) {

        display: none;

    }

    .purchase {

        width: 280px;

        right: 20px;

        bottom: 20px;

    }

}

</style>

</head>

<script>

/* =====================================================
   GSAP
===================================================== */

gsap.registerPlugin(ScrollTrigger);


/* =====================================================
   ELEMENTS
===================================================== */

const paper =
    document.querySelector(".paper");

const pencil =
    document.querySelector(".pencil");

const structure =
    document.querySelector(".structure");

const cad =
    document.querySelector(".cad");

const threeD =
    document.querySelector(".three-d");

const reality =
    document.querySelector(".reality");

const purchase =
    document.querySelector("#purchase");

const scanLine =
    document.querySelector("#scanLine");


/* =====================================================
   SKETCH LINES
===================================================== */

const sketchLines =
    document.querySelectorAll(
        ".sketch path, .sketch line, .sketch polyline, .sketch rect, .sketch ellipse"
    );


sketchLines.forEach(line => {

    let length =
        line.getTotalLength
            ? line.getTotalLength()
            : 1000;

    line.style.strokeDasharray =
        length;

    line.style.strokeDashoffset =
        length;

});


/* =====================================================
   STRUCTURE LINES
===================================================== */

const structureLines =
    document.querySelectorAll(
        ".structure line, .structure polyline, .structure rect"
    );


structureLines.forEach(line => {

    let length =
        line.getTotalLength
            ? line.getTotalLength()
            : 1000;

    line.style.strokeDasharray =
        length;

    line.style.strokeDashoffset =
        length;

});


/* =====================================================
   CAD LINES
===================================================== */

const cadLines =
    document.querySelectorAll(
        ".cad line, .cad rect, .cad path, .cad circle"
    );


cadLines.forEach(line => {

    let length =
        line.getTotalLength
            ? line.getTotalLength()
            : 1000;

    line.style.strokeDasharray =
        length;

    line.style.strokeDashoffset =
        length;

});


/* =====================================================
   MAIN TIMELINE
===================================================== */

const timeline =
    gsap.timeline({

        scrollTrigger: {

            trigger: ".hero",

            start: "top top",

            end: "+=6500",

            scrub: 1.2,

            pin: true,

            anticipatePin: 1

        }

    });


/* =====================================================
   SCENE 1
   PAPER APPEARS
===================================================== */

timeline.to(
    paper,
    {

        opacity: 1,

        scale: 1,

        rotation: -2,

        duration: 1.5,

        ease: "power3.out"

    }
);


/* =====================================================
   PENCIL
===================================================== */

timeline.to(
    pencil,
    {

        opacity: 1,

        duration: .4

    }
);


/* =====================================================
   DRAW SKETCH
===================================================== */

timeline.to(
    sketchLines,
    {

        strokeDashoffset: 0,

        duration: 4,

        stagger: .04,

        ease: "none"

    }
);


/* =====================================================
   PENCIL DISAPPEARS
===================================================== */

timeline.to(
    pencil,
    {

        opacity: 0,

/* =====================================================
   PROGRESS INDICATOR
===================================================== */

const progressItems =
    document.querySelectorAll(
        ".progress-item"
    );


ScrollTrigger.create({

    trigger: ".hero",

    start: "top top",

    end: "+=6500",

    onUpdate: self => {

        let p =
            self.progress;

        let active = 1;

        if (p > .16)
            active = 2;

        if (p > .32)
            active = 3;

        if (p > .48)
            active = 4;

        if (p > .68)
            active = 5;

        if (p > .86)
            active = 6;


        progressItems.forEach(
            (item, index) => {

                item.classList.toggle(
                    "active",
                    index + 1 === active
                );

            }
        );

    }

});


/* =====================================================
   MOUSE MOVEMENT
===================================================== */

document
    .querySelector(".hero")
    .addEventListener(
        "mousemove",
        e => {

            let x =
                (e.clientX /
                window.innerWidth - .5);

            let y =
                (e.clientY /
                window.innerHeight - .5);


            gsap.to(
                ".stage",
                {

                    x: x * 12,

                    y: y * 8,

                    duration: 1.2,

                    ease: "power2.out"

                }
            );

        }
    );
